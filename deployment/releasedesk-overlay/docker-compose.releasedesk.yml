# ReleaseDesk Everywhere overlay for StaffLess AI (this Stafless-ai fork).
# Does not replace docker-compose.yml — merge it last so these limits win over
# docker-compose.resources.yml (whose background 10g default would OOM D4as_v5).
#
# MUST run from this checkout's deployment/docker_compose (stock
# build.context is ../../backend). Do not `up` against Hub tags.
#   docker compose -f docker-compose.yml -f docker-compose.resources.yml \
#     -f ../releasedesk-overlay/docker-compose.releasedesk.yml \
#     build api_server background
#   docker compose -f docker-compose.yml -f docker-compose.resources.yml \
#     -f ../releasedesk-overlay/docker-compose.releasedesk.yml up -d --wait
#
# Overlay does not set build.context — that path is relative to THIS file
# (deployment/releasedesk-overlay), which is the wrong tree. Stock foss
# compose already builds ../../backend --target runtime when you `compose build`.
#
# Bind mounts resolve from the first compose file's directory
# (deployment/docker_compose), so nginx templates use ../releasedesk-overlay/nginx.
#
# This overlay:
#   - Does not start web_server (StaffLess AI UI) or local model servers
#   - Makes nginx independent of web_server and proxies all traffic to the API
#   - Makes model-server depends_on optional
#   - Caps RAM for D4as_v5 / D4s_v5 (16 GB). Host OS (Ubuntu 24.04) does not
#     change these limits. In-compose nginx is not host nginx.
#   - Adds an optional CPU TEI reranker (no host port). Start it alone:
#       docker compose -f docker-compose.yml -f docker-compose.resources.yml \
#         -f ../releasedesk-overlay/docker-compose.releasedesk.yml \
#         pull reranker
#       docker compose -f docker-compose.yml -f docker-compose.resources.yml \
#         -f ../releasedesk-overlay/docker-compose.releasedesk.yml \
#         up -d --no-deps --wait --wait-timeout 600 reranker
#     Do not unscoped `up --force-recreate`. Do not `build reranker` (pulled image).

name: onyx

services:
  web_server:
    profiles: ["onyx-ui"]

  inference_model_server:
    profiles: ["local-models"]

  indexing_model_server:
    profiles: ["local-models"]

  api_server:
    depends_on:
      inference_model_server:
        condition: service_started
        required: false
    environment:
      - DISABLE_MODEL_SERVER=true
      - MODEL_SERVER_HOST=disabled
      - INDEXING_MODEL_SERVER_HOST=disabled
      - FILE_STORE_BACKEND=${FILE_STORE_BACKEND:-postgres}
    deploy:
      resources:
        limits:
          cpus: ${API_SERVER_CPU_LIMIT:-1.0}
          memory: ${API_SERVER_MEM_LIMIT:-1536m}

  background:
    depends_on:
      inference_model_server:
        condition: service_started
        required: false
      indexing_model_server:
        condition: service_started
        required: false
    environment:
      - DISABLE_MODEL_SERVER=true
      - MODEL_SERVER_HOST=disabled
      - INDEXING_MODEL_SERVER_HOST=disabled
      - FILE_STORE_BACKEND=${FILE_STORE_BACKEND:-postgres}
      # 6 docprocessing workers * INDEX_BATCH_SIZE 16 OOMs a 2g cgroup (celery
      # MEMCG kills). Keep peak RSS inside BACKGROUND_MEM_LIMIT on D4as_v5.
      - INDEX_BATCH_SIZE=${INDEX_BATCH_SIZE:-4}
      - CELERY_WORKER_DOCPROCESSING_CONCURRENCY=${CELERY_WORKER_DOCPROCESSING_CONCURRENCY:-2}
    deploy:
      resources:
        limits:
          cpus: ${BACKGROUND_CPU_LIMIT:-1.5}
          memory: ${BACKGROUND_MEM_LIMIT:-4g}

  nginx:
    # Stock compose hard-requires web_server healthy or nginx never starts.
    depends_on:
      api_server:
        condition: service_healthy
      web_server:
        condition: service_started
        required: false
    volumes:
      # Replaces stock ../data/nginx so we never resolve web_server in upstream.
      # Path is relative to deployment/docker_compose (first -f file), not this overlay.
      - ../releasedesk-overlay/nginx:/nginx-templates:ro
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf
      && cp -a /nginx-templates/. /etc/nginx/conf.d/
      && sed 's/\r$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh
      && chmod +x /tmp/run-nginx.sh
      && /tmp/run-nginx.sh app.conf.template.api-only"
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPU_LIMIT:-0.25}
          memory: ${NGINX_MEM_LIMIT:-128m}

  relational_db:
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-1.0}
          memory: ${POSTGRES_MEM_LIMIT:-1g}

  cache:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  opensearch:
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - bootstrap.memory_lock=true
      # Stock compose hardcodes 2g heap. 1g heap + 2g cgroup fits 16 GB VMs.
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g

  # Hugging Face TEI (bge-reranker-base). Internal only: http://reranker:80
  # Query text and candidate passages stay on this VM. Weights download from
  # Hugging Face Hub on first start into reranker_model_cache. Not wired to
  # api_server env — that would recreate api_server. Do not put this on
  # profiles: [local-models] (that profile is empty on this VM).
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2
    restart: unless-stopped
    command: --model-id BAAI/bge-reranker-base --port 80
    volumes:
      - reranker_model_cache:/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: ${RERANKER_CPU_LIMIT:-1.0}
          # 2g OOMs while loading bge-reranker-base ONNX (exit 137). 3g still
          # fits D4as_v5 available RAM without changing other service limits.
          memory: ${RERANKER_MEM_LIMIT:-3g}

volumes:
  reranker_model_cache:
